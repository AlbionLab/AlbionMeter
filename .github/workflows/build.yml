name: Build and verify
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix web
      - run: dotnet build tools/AlbionMeter.Capture
      - run: dotnet run --project tests/AlbionMeter.Tests
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap0.8
      - if: runner.os == 'Linux'
        run: dotnet run --project tests/AlbionMeter.Tests -- --native-capture
      - run: node scripts/publish.mjs ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: albion-meter-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}
