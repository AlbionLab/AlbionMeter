name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: node scripts/publish.mjs ${{ matrix.runtime }}
      # Windows installer with auto-update (Velopack): self-contained, so it needs no .NET runtime. The previous
      # release is downloaded first so updates ship as small deltas; the very first one has nothing to download.
      - name: Windows installer
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Directory.Build.props -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          dotnet publish src/AlbionMeter.Server -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item artifacts/installer/web.config -ErrorAction SilentlyContinue
          Copy-Item artifacts/win-x64/LEIA-ME.txt artifacts/installer/
          dotnet tool install -g vpk --version 1.2.161
          vpk download github --repoUrl https://github.com/AlbionLab/AlbionMeter --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous installer release; packing without deltas."; $global:LASTEXITCODE = 0 }
          vpk pack --packId AlbionLab.AlbionMeter --packVersion $version --packDir artifacts/installer --mainExe AlbionMeter.Server.exe --packTitle "Albion Meter" --packAuthors AlbionLab --icon src/AlbionMeter.Server/app.ico --noPortable --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem artifacts/velopack -File | Where-Object { $_.Name -like "*-full.nupkg" -and $_.Name -notlike "*-$version-full.nupkg" } | Remove-Item
      - uses: actions/upload-artifact@v4
        with:
          name: albion-meter-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/velopack/*
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Directory.Build.props
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "value=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Flatten packages
        run: find packages -mindepth 2 -type f -exec mv -t packages {} + && find packages -mindepth 1 -type d -empty -delete
      - run: sha256sum * > SHA256SUMS.txt
        working-directory: packages
      - name: Publish release v${{ steps.version.outputs.value }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Albion Meter $TAG" --generate-notes --latest
          fi
