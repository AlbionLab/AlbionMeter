name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: node scripts/publish.mjs ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: albion-meter-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - run: sha256sum * > SHA256SUMS.txt
        working-directory: packages
      - run: gh release create "build-${{ github.run_number }}" packages/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Albion Meter build ${{ github.run_number }}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
