name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: node scripts/publish.mjs ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: albion-meter-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Directory.Build.props
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "value=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - run: sha256sum * > SHA256SUMS.txt
        working-directory: packages
      - name: Publish release v${{ steps.version.outputs.value }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Albion Meter $TAG" --generate-notes --latest
          fi
