name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  # Builds the current version and, on main, every tag that has no release yet, so a lost release is rebuilt from its tag.
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Directory.Build.props
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          current=v$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          releases='[]'
          if [ "$BACKFILL" = true ]; then
            existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
            for tag in $(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' | sort -V); do
              if [ "$tag" != "$current" ] && ! grep -qxF "$tag" <<< "$existing"; then
                releases=$(jq -c --arg tag "$tag" '. + [{tag: $tag, ref: $tag, latest: false}]' <<< "$releases")
              fi
            done
          fi
          releases=$(jq -c --arg tag "$current" --arg ref "$GITHUB_SHA" '. + [{tag: $tag, ref: $ref, latest: true}]' <<< "$releases")
          builds=$(jq -c '[.[] as $release | ({os: "ubuntu-latest", runtime: "linux-x64"}, {os: "windows-latest", runtime: "win-x64"}) | . + {tag: $release.tag, ref: $release.ref}]' <<< "$releases")
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
  build:
    name: build ${{ matrix.tag }} ${{ matrix.runtime }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - run: npm ci --prefix web
      - run: node scripts/publish.mjs ${{ matrix.runtime }}
      # Tags older than the desktop app only have the zip and tar.gz packages.
      - name: Desktop app
        if: hashFiles('desktop/package.json') != ''
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          dotnet publish src/AlbionMeter.Server -c Release -r ${{ matrix.runtime }} --self-contained true -p:DebugType=None -p:DebugSymbols=false -o desktop/server
          rm -f desktop/server/web.config
          npm ci --prefix desktop
          cd desktop
          npx electron-builder ${{ matrix.runtime == 'win-x64' && '--win' || '--linux' }} --x64 --publish never -c.extraMetadata.version=$version
      - uses: actions/upload-artifact@v4
        with:
          name: albion-meter-${{ matrix.tag }}-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest*.yml
  # One release at a time, oldest first, so the current version is published last and stays the latest.
  release:
    name: release ${{ matrix.tag }}
    if: always() && needs.plan.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [plan, build]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: albion-meter-${{ matrix.tag }}-*
      - name: Flatten packages
        env:
          TAG: ${{ matrix.tag }}
        run: |
          for runtime in linux-x64 win-x64; do
            test -d "packages/albion-meter-$TAG-$runtime" || { echo "The $runtime build of $TAG is missing."; exit 1; }
          done
          find packages -mindepth 2 -type f -exec mv -t packages {} + && find packages -mindepth 1 -type d -empty -delete
      - run: sha256sum * > SHA256SUMS.txt
        working-directory: packages
      - name: Publish release ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          REF: ${{ matrix.ref }}
          LATEST: ${{ matrix.latest }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --target "$REF" --title "Albion Meter $TAG" --generate-notes --latest="$LATEST"
          fi
