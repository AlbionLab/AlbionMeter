name: Rust
# The Rust port (rust/): lint, tests, the release build and the Velopack packages, on Linux and Windows. Packages are
# workflow artifacts only; nothing here creates a GitHub release.
on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  NPCAP_SDK: https://npcap.com/dist/npcap-sdk-1.15.zip
  VELOPACK_VERSION: 1.2.161
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: meter-app
          - os: windows-latest
            exe: meter-app.exe
            # One test at a time: libtest names each test before it runs, so a crash (no panic, no output) names its test.
            test_args: -- --test-threads=1
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev
      # wpcap.lib to link against; wpcap.dll itself is delay-loaded (rust/.cargo/config.toml), so no Npcap install is needed.
      - name: Npcap SDK
        if: runner.os == 'Windows'
        run: |
          curl -sSfL "$NPCAP_SDK" -o "$RUNNER_TEMP/npcap-sdk.zip"
          unzip -q "$RUNNER_TEMP/npcap-sdk.zip" -d "$RUNNER_TEMP/npcap-sdk"
          echo "LIBPCAP_LIBDIR=$RUNNER_TEMP\\npcap-sdk\\Lib\\x64" >> "$GITHUB_ENV"
      - name: Clippy
        run: scripts/ci-run.sh cargo clippy --workspace --all-targets -- -D warnings
      # Each check runs even when an earlier one failed, so one run shows every problem.
      - name: Tests
        if: success() || failure()
        # Test threads get 8 MB of stack (2 MB by default): Slint's UI tests build the whole window in a debug build.
        env:
          RUST_MIN_STACK: 8388608
        run: scripts/ci-run.sh cargo test --workspace ${{ matrix.test_args }}
      # A crash in the meter-app tests on Windows prints nothing; the debugger gives its stack.
      - name: Crash stack
        if: failure() && runner.os == 'Windows'
        env:
          RUST_MIN_STACK: 8388608
        run: |
          exe=$(cargo test -p meter-app --bin meter-app --no-run --message-format=json 2>/dev/null | python3 -c "
          import json, sys
          for line in sys.stdin:
              message = json.loads(line)
              if message.get('reason') == 'compiler-artifact' and message.get('executable') and message['profile']['test']:
                  print(message['executable'])" | tail -1)
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          # The faulting thread's stack at the first-chance access violation, and again if it is fatal.
          printf '%s\n' '.symfix' 'sxe -c ".echo FIRST-CHANCE; .lastevent; ~#kn 30; gn" -c2 ".echo SECOND-CHANCE; .lastevent; .exr -1; r; ~*kn 12; !analyze -v; lm; q" av' 'g' > cdb.txt
          "$cdb" -G -lines -cf cdb.txt "$exe" --test-threads=1 > cdb.log 2>&1 || true
          tail -200 cdb.log
          python3 -c "
          import re
          text = open('cdb.log', encoding='utf-8', errors='replace').read()
          for marker in ('FIRST-CHANCE', 'SECOND-CHANCE'):
              found = re.search('^' + marker, text, re.M)
              if found:
                  size = 3800 if marker == 'FIRST-CHANCE' else 3800 * 7
                  block = text[found.start():found.start() + size]
                  for part in range(0, len(block), 3800):
                      chunk = block[part:part + 3800]
                      print('::error title=meter-app test crash, ' + marker.lower() + ' ' + str(part // 3800 + 1) + '::' + chunk.replace('%', '%25').replace('\\r', '').replace('\\n', '%0A'))"
      - name: Release build
        if: success() || failure()
        id: release
        run: scripts/ci-run.sh cargo build --release -p meter-app
      - name: Size
        if: (success() || failure()) && steps.release.outcome == 'success'
        run: ls -l "target/release/${{ matrix.exe }}" && echo "::notice title=meter-app size (${{ runner.os }})::$(stat -c %s "target/release/${{ matrix.exe }}" 2>/dev/null || wc -c < "target/release/${{ matrix.exe }}") bytes"
      - uses: actions/upload-artifact@v4
        if: (success() || failure()) && steps.release.outcome == 'success'
        with:
          name: meter-app-${{ runner.os }}
          path: rust/target/release/${{ matrix.exe }}
      # Velopack: Setup.exe on Windows, an AppImage on Linux, on the rust-beta channel; built here, never published.
      - uses: actions/setup-dotnet@v4
        if: (success() || failure()) && steps.release.outcome == 'success'
        with:
          dotnet-version: 8.0.x
      - name: Package
        if: (success() || failure()) && steps.release.outcome == 'success'
        id: package
        run: |
          dotnet tool install -g vpk --version "$VELOPACK_VERSION"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p ../package/assets
          cp "target/release/${{ matrix.exe }}" ../package/
          cp ../assets/game-data/combat.json ../assets/game-data/maps.json ../package/assets/
          if [ "$RUNNER_OS" = Windows ]; then icon=../src/AlbionMeter.Server/app.ico; else icon=crates/meter-app/assets/icon.png; fi
          vpk pack --packId AlbionMeter --packVersion "$version-ci.$GITHUB_RUN_NUMBER" --packTitle "Albion Meter" --packAuthors AlbionLab \
            --packDir ../package --mainExe "${{ matrix.exe }}" --icon "$icon" --channel rust-beta --outputDir ../releases
          ls -l ../releases
          for file in ../releases/*; do echo "::notice title=package ($RUNNER_OS)::$(basename "$file") $(wc -c < "$file") bytes"; done
      - uses: actions/upload-artifact@v4
        if: (success() || failure()) && steps.package.outcome == 'success'
        with:
          name: packages-${{ runner.os }}
          path: releases/
