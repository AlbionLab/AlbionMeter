name: Rust
# Albion Meter (rust/): lint, tests, the release build and the Velopack packages, on Linux and Windows. A push to `main`
# also publishes them:
#   - `rust-v<version>`: the release of this version (Setup.exe, AppImage, the full packages), with the version taken from
#     rust/Cargo.toml; pushing again without a new version replaces its files, as electron-builder's release does;
#   - `rust-latest`: always the newest version's packages and `releases.<channel>.json`, the update feed (Velopack's
#     latest.yml) the meter reads from a fixed address, however many Electron releases come after it.
# Both are prereleases and never GitHub's "Latest": that stays the last Electron meter (v0.1.29), whose update is the
# Rust meter itself, so a player still on any older Electron version updates to it and from there moves to Rust.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# A newer push cancels a pull request's checks; a push's run always finishes, so a release is never left half done.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
  NPCAP_SDK: https://npcap.com/dist/npcap-sdk-1.15.zip
  VELOPACK_VERSION: 1.2.161
jobs:
  # Lint and tests, in parallel with the package job below: the two used to run one after the other in one job.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: meter-app
          - os: windows-latest
            exe: meter-app.exe
    runs-on: ${{ matrix.os }}
    # Line tables only in the test build: stacks keep their file and line (the Windows crash report), and the debug
    # build and its link take a fraction of full debug info. The release build is untouched.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev
      # wpcap.lib to link against; wpcap.dll itself is delay-loaded (rust/.cargo/config.toml), so no Npcap install is needed.
      - name: Npcap SDK
        if: runner.os == 'Windows'
        run: |
          curl -sSfL "$NPCAP_SDK" -o "$RUNNER_TEMP/npcap-sdk.zip"
          unzip -q "$RUNNER_TEMP/npcap-sdk.zip" -d "$RUNNER_TEMP/npcap-sdk"
          echo "LIBPCAP_LIBDIR=$RUNNER_TEMP\\npcap-sdk\\Lib\\x64" >> "$GITHUB_ENV"
      - name: Clippy
        run: scripts/ci-run.sh cargo clippy --workspace --all-targets -- -D warnings
      # Each check runs even when an earlier one failed, so one run shows every problem.
      - name: Tests
        if: success() || failure()
        # Test threads get 8 MB of stack (2 MB by default): Slint's UI tests build the whole window in a debug build.
        env:
          RUST_MIN_STACK: 8388608
        run: scripts/ci-run.sh cargo test --workspace --no-fail-fast
      # A crash in the meter-app tests on Windows prints nothing; the debugger gives its stack.
      - name: Crash stack
        if: failure() && runner.os == 'Windows'
        env:
          RUST_MIN_STACK: 8388608
        run: |
          exe=$(cargo test -p meter-app --bin meter-app --no-run --message-format=json 2>/dev/null | python3 -c "
          import json, sys
          for line in sys.stdin:
              message = json.loads(line)
              if message.get('reason') == 'compiler-artifact' and message.get('executable') and message['profile']['test']:
                  print(message['executable'])" | tail -1)
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          # The faulting thread's stack at the first-chance access violation, and again if it is fatal.
          printf '%s\n' '.symfix' 'sxe -c ".echo FIRST-CHANCE; .lastevent; ~#kn 30; gn" -c2 ".echo SECOND-CHANCE; .lastevent; .exr -1; r; ~*kn 12; !analyze -v; lm; q" av' 'g' > cdb.txt
          "$cdb" -G -lines -cf cdb.txt "$exe" --test-threads=1 > cdb.log 2>&1 || true
          tail -200 cdb.log
          python3 -c "
          import re
          text = open('cdb.log', encoding='utf-8', errors='replace').read()
          for marker in ('FIRST-CHANCE', 'SECOND-CHANCE'):
              found = re.search('^' + marker, text, re.M)
              if found:
                  size = 3800 if marker == 'FIRST-CHANCE' else 3800 * 7
                  block = text[found.start():found.start() + size]
                  for part in range(0, len(block), 3800):
                      chunk = block[part:part + 3800]
                      print('::error title=meter-app test crash, ' + marker.lower() + ' ' + str(part // 3800 + 1) + '::' + chunk.replace('%', '%25').replace('\\r', '').replace('\\n', '%0A'))"
      # Which DLL each executable takes WaitOnAddress from; nothing may come from vertdll (the enclave runtime: pcap's
      # windows-sys 0.36 import library binds WaitOnAddress there, see meter-app/build.rs).
      - name: Imports
        if: (success() || failure()) && runner.os == 'Windows'
        run: |
          python3 -m pip install -q pefile
          test=$(cargo test -p meter-app --bin meter-app --no-run --message-format=json 2>/dev/null | python3 -c "
          import json, sys
          for line in sys.stdin:
              message = json.loads(line)
              if message.get('reason') == 'compiler-artifact' and message.get('executable') and message['profile']['test']:
                  print(message['executable'])" | tail -1)
          python3 -c "
          import pefile, sys
          wrong = []
          for path in sys.argv[1:]:
              if not path:
                  continue
              pe = pefile.PE(path, fast_load=True)
              pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT'], pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_DELAY_IMPORT']])
              lines = []
              for kind in ('DIRECTORY_ENTRY_IMPORT', 'DIRECTORY_ENTRY_DELAY_IMPORT'):
                  for entry in getattr(pe, kind, []):
                      dll = entry.dll.decode()
                      names = [imp.name.decode() for imp in entry.imports if imp.name]
                      wanted = [name for name in names if 'WaitOnAddress' in name or 'WakeByAddress' in name or 'vertdll' in dll.lower()]
                      lines.append(kind[16:] + ' ' + dll + ' (' + str(len(names)) + ')' + (': ' + ', '.join(wanted[:40]) if wanted else ''))
                      if 'vertdll' in dll.lower():
                          wrong.append(path + ' imports ' + ', '.join(names) + ' from ' + dll)
              print('::notice title=imports of ' + path.replace(chr(92), '/').split('/')[-1] + '::' + '%0A'.join(lines)[:3900])
          for line in wrong:
              print('::error title=vertdll import::' + line)
          sys.exit(1 if wrong else 0)
          " "$test"
  # The shipped executable and its packages; the release profile (fat LTO, one codegen unit, opt-level s) is what keeps
  # the meter small and fast, so only the work around it is trimmed.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: meter-app
          - os: windows-latest
            exe: meter-app.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev
      # wpcap.lib to link against; wpcap.dll itself is delay-loaded (rust/.cargo/config.toml), so no Npcap install is needed.
      - name: Npcap SDK
        if: runner.os == 'Windows'
        run: |
          curl -sSfL "$NPCAP_SDK" -o "$RUNNER_TEMP/npcap-sdk.zip"
          unzip -q "$RUNNER_TEMP/npcap-sdk.zip" -d "$RUNNER_TEMP/npcap-sdk"
          echo "LIBPCAP_LIBDIR=$RUNNER_TEMP\\npcap-sdk\\Lib\\x64" >> "$GITHUB_ENV"
      - name: Release build
        id: release
        run: scripts/ci-run.sh cargo build --release -p meter-app
      # The shipped executable, headless: a fixture screen, then a synthetic fight replayed through the real runtime, with
      # throwaway settings and storage (on Windows without Npcap installed: wpcap.dll is delay-loaded).
      - name: Smoke test
        if: (success() || failure()) && steps.release.outcome == 'success'
        id: smoke
        env:
          ALBION_METER_PACKAGED: 0
        run: |
          export ALBION_METER_CONFIG_DIR="$RUNNER_TEMP/smoke-settings"
          mkdir -p ../smoke
          exe="target/release/${{ matrix.exe }}"
          scripts/ci-run.sh "$exe" --screen meter-damage --screenshot ../smoke/fixture.png
          scripts/ci-run.sh "$exe" "--Storage:Directory=$RUNNER_TEMP/smoke-storage" --replay crates/meter-app/tests/fixtures/solo.pcap --screenshot ../smoke/replay.png
          ls -l ../smoke/*.png
          echo "::notice title=smoke test (${{ runner.os }})::the release executable rendered a fixture screen and a replayed fight"
      - uses: actions/upload-artifact@v4
        if: (success() || failure()) && steps.smoke.outcome != 'skipped'
        with:
          name: smoke-${{ runner.os }}
          path: smoke/*.png
      # Which DLL each executable takes WaitOnAddress from; nothing may come from vertdll (the enclave runtime: pcap's
      # windows-sys 0.36 import library binds WaitOnAddress there, see meter-app/build.rs), nor from the C runtime's DLLs.
      - name: Imports
        if: (success() || failure()) && runner.os == 'Windows'
        run: |
          python3 -m pip install -q pefile
          python3 -c "
          import pefile, sys
          wrong = []
          for path in sys.argv[1:]:
              if not path:
                  continue
              pe = pefile.PE(path, fast_load=True)
              pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT'], pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_DELAY_IMPORT']])
              lines = []
              for kind in ('DIRECTORY_ENTRY_IMPORT', 'DIRECTORY_ENTRY_DELAY_IMPORT'):
                  for entry in getattr(pe, kind, []):
                      dll = entry.dll.decode()
                      names = [imp.name.decode() for imp in entry.imports if imp.name]
                      wanted = [name for name in names if 'WaitOnAddress' in name or 'WakeByAddress' in name or 'vertdll' in dll.lower()]
                      lines.append(kind[16:] + ' ' + dll + ' (' + str(len(names)) + ')' + (': ' + ', '.join(wanted[:40]) if wanted else ''))
                      if 'vertdll' in dll.lower():
                          wrong.append(path + ' imports ' + ', '.join(names) + ' from ' + dll)
                      # The shipped meter links the C runtime in (rust/.cargo/config.toml): none of it may be a DLL to install.
                      if dll.lower().startswith(('vcruntime', 'msvcp', 'api-ms-win-crt')):
                          wrong.append(path + ' needs the Visual C++ runtime: ' + dll)
              print('::notice title=imports of ' + path.replace(chr(92), '/').split('/')[-1] + '::' + '%0A'.join(lines)[:3900])
          for line in wrong:
              print('::error title=wrong import::' + line)
          sys.exit(1 if wrong else 0)
          " target/release/${{ matrix.exe }}
      - name: Size
        if: (success() || failure()) && steps.release.outcome == 'success'
        run: ls -l "target/release/${{ matrix.exe }}" && echo "::notice title=meter-app size (${{ runner.os }})::$(stat -c %s "target/release/${{ matrix.exe }}" 2>/dev/null || wc -c < "target/release/${{ matrix.exe }}") bytes"
      - uses: actions/upload-artifact@v4
        if: (success() || failure()) && steps.release.outcome == 'success'
        with:
          name: meter-app-${{ runner.os }}
          path: rust/target/release/${{ matrix.exe }}
      # Velopack: Setup.exe on Windows, an AppImage on Linux. A channel per system (rust-win, rust-linux), so both fit in
      # one release; an installed meter updates on the channel it was packaged with. Full packages only, like the
      # Electron installers: no delta against an earlier version.
      - uses: actions/setup-dotnet@v4
        if: (success() || failure()) && steps.release.outcome == 'success'
        with:
          dotnet-version: 8.0.x
      - name: Package
        if: (success() || failure()) && steps.release.outcome == 'success'
        id: package
        env:
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          dotnet tool install -g vpk --version "$VELOPACK_VERSION"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # A published build carries the version itself; any other build is a CI prerelease of it.
          if [ "$PUBLISH" != true ]; then version="$version-ci.$GITHUB_RUN_NUMBER"; fi
          mkdir -p ../package/assets
          cp "target/release/${{ matrix.exe }}" ../package/
          cp ../assets/game-data/combat.json ../assets/game-data/maps.json ../package/assets/
          if [ "$RUNNER_OS" = Windows ]; then icon=crates/meter-app/assets/icon.ico; else icon=crates/meter-app/assets/icon.png; fi
          if [ "$RUNNER_OS" = Windows ]; then channel=rust-win; else channel=rust-linux; fi
          # Not "AlbionMeter": Velopack installs into %LocalAppData%\<packId> and removes that folder on uninstall, and
          # %LocalAppData%\AlbionMeter is the meter's history.
          vpk pack --packId AlbionLab.AlbionMeter --packVersion "$version" --packTitle "Albion Meter" --packAuthors AlbionLab \
            --packDir ../package --mainExe "${{ matrix.exe }}" --icon "$icon" --channel "$channel" --delta None --outputDir ../releases
          ls -l ../releases
          for file in ../releases/*; do echo "::notice title=package ($RUNNER_OS)::$(basename "$file") $(wc -c < "$file") bytes"; done
      - uses: actions/upload-artifact@v4
        if: (success() || failure()) && steps.package.outcome == 'success'
        with:
          name: packages-${{ runner.os }}
          path: releases/
  # Publishes the packages of both systems, only when every check passed on both.
  release:
    if: github.event_name == 'push'
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, in push order.
    concurrency:
      group: rust-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rust/Cargo.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: packages-*
      - name: Collect packages
        run: |
          for system in Linux Windows; do
            test -d "downloads/packages-$system" || { echo "::error::The $system packages are missing."; exit 1; }
          done
          mkdir packages
          # Both systems in one release: a file name used by both would overwrite the other's.
          duplicates=$(find downloads -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$duplicates" ]; then echo "::error::Both systems produced: $duplicates"; exit 1; fi
          find downloads -type f -exec mv -t packages {} +
          ls -l packages
          for feed in releases.rust-win.json releases.rust-linux.json; do
            test -f "packages/$feed" || { echo "::error::The update feed $feed is missing."; exit 1; }
          done
          (cd packages && sha256sum * > SHA256SUMS.txt)
          echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: Publish rust-v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rust-v${{ env.VERSION }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Albion Meter $VERSION (Rust beta)" \
              --generate-notes --prerelease --latest=false
          fi
      # The feed the meter reads: this version's files are uploaded first and the older ones removed after, so a meter
      # checking meanwhile always finds a complete feed.
      - name: Update rust-latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rust-latest
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Albion Meter (Rust beta) — update feed" \
              --notes "The newest Rust build of Albion Meter, read by the meter's updater. Every version also has its own rust-v<version> release." \
              --prerelease --latest=false
          fi
          gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          current=$(ls packages)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            if ! grep -qxF "$name" <<< "$current"; then gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes; fi
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Albion Meter $VERSION (Rust beta) — update feed"
      # albionlab.app's download page lists one row per file, added through its admin API, and offers each system's newest
      # version: a new version is added once, pointing at this release's files; the same version pushed again is left alone.
      - name: Offer rust-v${{ env.VERSION }} on albionlab.app
        env:
          ALBIONLAB_EMAIL: ${{ secrets.ALBIONLAB_ADMIN_EMAIL }}
          ALBIONLAB_PASSWORD: ${{ secrets.ALBIONLAB_ADMIN_PASSWORD }}
        run: |
          if [ -z "$ALBIONLAB_EMAIL" ] || [ -z "$ALBIONLAB_PASSWORD" ]; then
            echo "::warning title=albionlab.app::ALBIONLAB_ADMIN_EMAIL/ALBIONLAB_ADMIN_PASSWORD are not set: add $VERSION to the download page by hand."
            exit 0
          fi
          python3 - <<'EOF'
          import json, os, http.cookiejar, urllib.request
          version = os.environ['VERSION']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/rust-v{version}/"
          files = [('windows', 'installer', None, 'AlbionLab.AlbionMeter-rust-win-Setup.exe'),
                   ('windows', 'archive', None, 'AlbionLab.AlbionMeter-rust-win-Portable.zip'),
                   ('linux', 'installer', 'AppImage · x64', 'AlbionLab.AlbionMeter-rust-linux.AppImage')]
          for *_, name in files:
              assert os.path.exists(f'packages/{name}'), f'{name} is not in this release'
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def call(method, path, body=None):
              request = urllib.request.Request('https://albionlab.app/api/admin' + path, None if body is None else json.dumps(body).encode(), method=method,
                                               headers={'X-Admin-Request': '1', 'Content-Type': 'application/json', 'User-Agent': 'albionmeter-ci'})
              with opener.open(request, timeout=30) as response:
                  text = response.read()
                  return json.loads(text) if text else None
          call('POST', '/login', {'email': os.environ['ALBIONLAB_EMAIL'], 'password': os.environ['ALBIONLAB_PASSWORD']})
          if any(row['version'] == version for row in call('GET', '/releases')):
              print(f'::notice title=albionlab.app::{version} is already on the download page'); raise SystemExit
          for platform, kind, label, name in files:
              row = call('POST', '/releases', {'version': version, 'platform': platform, 'architecture': 'x64', 'kind': kind, 'label': label,
                                               'externalUrl': base + name, 'visible': True})
              print(f"::notice title=albionlab.app::{platform} {kind} {version} -> https://albionlab.app{row['url']}")
          EOF
