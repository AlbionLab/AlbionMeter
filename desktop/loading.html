<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Albion Meter</title>
<style>
:root { --bg: #0a0d13; --bar: #0d1119; --surface: #11161f; --surface-2: #161c27; --border: #1f2734; --border-strong: #2a3342; --text: #e9ecf2; --text-2: #c3cad6; --muted: #808a9b; --accent: #f08a24; --good: #3ecf7a; --warn: #e7ad42; --bad: #ec6450; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--muted); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; user-select: none; }
.titlebar { display: flex; align-items: center; height: 52px; padding-left: 20px; border-bottom: 1px solid var(--border); background: var(--bar); -webkit-app-region: drag; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.brand svg { width: 26px; height: 26px; }
.controls { display: flex; height: 100%; margin-left: auto; -webkit-app-region: no-drag; }
.controls button { display: grid; place-items: center; width: 46px; height: 100%; padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
.controls button:hover { background: #ffffff10; color: var(--text); }
.controls button.close:hover { background: #e81123; color: #fff; }
main { flex: 1; display: grid; place-items: center; padding: 24px; }
.card { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(420px, 100%); animation: rise .4s ease-out both; }
.logo { width: 76px; height: 76px; }
h1 { margin: 0; color: var(--text); font-size: 18px; letter-spacing: .1em; text-transform: uppercase; }
.version { margin-top: -12px; font-size: 12px; }
ol { display: flex; flex-direction: column; gap: 4px; width: 100%; margin: 6px 0 0; padding: 10px; list-style: none; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 8px 8px; border-radius: 8px; color: var(--muted); transition: background .2s, color .2s; }
li.active { background: var(--surface-2); color: var(--text); }
li.done { color: var(--text-2); }
li small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.45; user-select: text; }
li.warning small { color: #f0cd8a; }
li.error small { color: #f3a294; }
.state { display: grid; place-items: center; width: 22px; height: 22px; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
.state .spinner { width: 16px; height: 16px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; background: none; animation: spin .8s linear infinite; }
.state svg { width: 16px; height: 16px; }
.failure { display: none; flex-direction: column; gap: 12px; width: 100%; padding: 14px; border: 1px solid #ec645066; border-radius: 12px; background: #ec64501a; color: #f3a294; }
.failure.shown { display: flex; animation: rise .3s ease-out both; }
.failure p { margin: 0; user-select: text; }
.actions { display: flex; gap: 8px; justify-content: flex-end; }
.button { height: 32px; padding: 0 13px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-2); color: var(--text-2); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.button:hover { border-color: #3a4558; color: var(--text); }
.button.primary { border-color: var(--accent); background: var(--accent); color: #111; font-weight: 700; }
.button.primary:hover { background: #f59a3e; color: #111; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header class="titlebar">
  <span class="brand"><svg viewBox="120 132 1030 1030" aria-hidden="true"><use href="#mark"/></svg>Albion Meter</span>
  <div class="controls">
    <button data-window="minimize" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
    <button data-window="maximize" aria-label="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
    <button data-window="close" class="close" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
  </div>
</header>
<main>
  <section class="card">
    <svg class="logo" viewBox="120 132 1030 1030" aria-hidden="true"><use href="#mark"/></svg>
    <h1>Albion Meter</h1>
    <span class="version" id="version"></span>
    <ol id="steps" aria-live="polite"></ol>
    <div class="failure" id="failure" role="alert">
      <p id="message"></p>
      <div class="actions">
        <button class="button" data-startup="logs">Open logs</button>
        <button class="button" data-startup="quit">Close</button>
        <button class="button primary" data-startup="retry">Try again</button>
      </div>
    </div>
  </section>
</main>
<svg width="0" height="0" style="position:absolute"><defs><g id="mark"><g transform="translate(0 1254) scale(.1 -.1)" fill="#F98714"><path d="M8195 9866 c-49 -32 -153 -97 -460 -286 -82 -51 -206 -127 -275 -170 -162 -100 -635 -391 -677 -416 -18 -10 -127 -77 -242 -149 l-210 -130 -1 -87 0 -87 48 -6 c252 -34 429 -168 503 -382 l20 -58 0 -2915 c0 -1603 3 -2920 7 -2927 8 -13 311 -14 2579 -13 l992 0 128 176 c312 429 596 854 582 869 -2 1 -62 -5 -134 -16 -285 -40 -685 -101 -770 -116 l-90 -16 -967 -4 -968 -4 0 3386 c0 1862 -3 3385 -7 3384 -5 0 -30 -15 -58 -33z"/><path d="M5993 8159 c-22 -30 -90 -126 -153 -214 -62 -88 -130 -182 -150 -210 -54 -74 -123 -170 -348 -485 -112 -157 -234 -328 -272 -380 -38 -52 -113 -156 -166 -230 -54 -74 -125 -173 -159 -220 -90 -126 -159 -221 -250 -350 -45 -63 -186 -261 -315 -440 -128 -179 -288 -401 -355 -495 -66 -93 -143 -201 -171 -239 -27 -38 -74 -104 -104 -147 -98 -137 -288 -402 -352 -489 -34 -47 -134 -186 -223 -310 -88 -124 -184 -256 -212 -295 -27 -38 -141 -198 -253 -355 -112 -157 -219 -305 -239 -330 -146 -185 -406 -449 -595 -605 -60 -50 -121 -100 -135 -112 l-26 -22 1432 -1 1433 0 -109 108 -109 107 -33 70 c-109 232 -14 433 510 1081 35 43 84 102 109 129 l45 50 848 3 849 2 0 419 0 419 -22 6 c-13 3 -270 6 -572 6 l-548 0 28 38 c36 47 385 491 645 818 182 230 294 373 422 537 l47 61 0 861 0 861 -15 57 c-47 182 -203 317 -395 343 l-48 6 -39 -53z"/></g></g></defs></svg>
<script>
const desktop = window.albionDesktop;
const icons = {
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="#3ecf7a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  warning: '<svg viewBox="0 0 24 24" fill="none" stroke="#e7ad42" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>',
  error: '<svg viewBox="0 0 24 24" fill="none" stroke="#ec6450" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
};
const escape = text => String(text).replace(/[&<>"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]);
function render(startup) {
  document.getElementById('steps').innerHTML = startup.steps.map(step => `<li class="${step.state}"><span class="state">${step.state === 'active' ? '<i class="spinner"></i>' : icons[step.state] ?? '<i></i>'}</span><span>${escape(step.label)}${step.detail ? `<small>${escape(step.detail)}</small>` : ''}</span></li>`).join('');
  document.getElementById('failure').classList.toggle('shown', Boolean(startup.error));
  document.getElementById('message').textContent = startup.error ?? '';
}
document.querySelectorAll('[data-window]').forEach(button => button.addEventListener('click', () => desktop?.window(button.dataset.window)));
document.querySelectorAll('[data-startup]').forEach(button => button.addEventListener('click', () => desktop?.startup(button.dataset.startup)));
if (desktop) {
  desktop.onStartup(render);
  desktop.info().then(info => { document.getElementById('version').textContent = `Version ${info.version}`; render(info.startup); });
}
</script>
</body>
</html>
