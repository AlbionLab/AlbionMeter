<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Albion Meter</title>
<style>
:root { --bg: #0a0d13; --surface: #11161f; --surface-2: #161c27; --border: #1f2734; --border-strong: #2a3342; --text: #e9ecf2; --text-2: #c3cad6; --muted: #808a9b; --faint: #5b6577; --accent: #f08a24; --warn: #e7ad42; --bad: #ec6450; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { position: relative; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 0%, #f08a2414, transparent 55%), var(--bg); color: var(--muted); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; user-select: none; -webkit-app-region: drag; }
body::after { content: ''; position: absolute; inset: 0; border: 1px solid var(--border); pointer-events: none; }
.controls { position: absolute; top: 0; right: 0; display: flex; -webkit-app-region: no-drag; }
.controls button { display: grid; place-items: center; width: 40px; height: 32px; padding: 0; border: 0; background: none; color: var(--faint); cursor: pointer; transition: background .15s, color .15s; }
.controls button:hover { background: #ffffff10; color: var(--text); }
.controls button.close:hover { background: #e81123; color: #fff; }
main { display: flex; flex-direction: column; align-items: center; width: min(320px, calc(100% - 48px)); transition: opacity .25s ease, transform .25s ease; animation: enter .45s cubic-bezier(.2, .8, .2, 1) both; }
body.leaving main { opacity: 0; transform: scale(.96); }
.mark { position: relative; display: grid; place-items: center; width: 64px; height: 64px; }
.mark::before { content: ''; position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, #f08a2440, transparent 65%); animation: glow 2.4s ease-in-out infinite; }
.mark svg { position: relative; width: 56px; height: 56px; }
h1 { margin: 14px 0 0; color: var(--text); font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.status { min-height: 20px; margin-top: 18px; color: var(--text-2); font-size: 12.5px; text-align: center; }
.detail { margin-top: 4px; color: var(--muted); font-size: 11.5px; line-height: 1.45; text-align: center; user-select: text; -webkit-app-region: no-drag; }
.detail.warning { color: #f0cd8a; }
.track { position: relative; width: 100%; height: 3px; margin-top: 12px; overflow: hidden; border-radius: 3px; background: var(--surface-2); }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: linear-gradient(90deg, #f08a24, #f6a656); transition: width .35s ease; }
.track::after { content: ''; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, #ffffff26, transparent); animation: shimmer 1.3s ease-in-out infinite; }
.version { margin-top: 14px; color: var(--faint); font-size: 11px; letter-spacing: .04em; }
.failure { display: none; flex-direction: column; gap: 12px; width: 100%; margin-top: 16px; -webkit-app-region: no-drag; }
.failure p { margin: 0; padding: 10px 12px; border: 1px solid #ec645055; border-radius: 9px; background: #ec645014; color: #f3a294; font-size: 12px; line-height: 1.45; text-align: center; user-select: text; }
.actions { display: flex; gap: 6px; }
.actions button { flex: 1; height: 30px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-2); color: var(--text-2); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.actions button:hover { border-color: #3a4558; color: var(--text); }
.actions button.primary { border-color: var(--accent); background: var(--accent); color: #111; font-weight: 700; }
.actions button.primary:hover { background: #f59a3e; }
body.failed .failure { display: flex; animation: enter .3s ease-out both; }
body.failed .track, body.failed .status { display: none; }
body.failed .mark::before { animation: none; opacity: .35; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.06); } }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="controls">
  <button data-window="minimize" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
  <button data-window="close" class="close" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
</div>
<main>
  <div class="mark"><svg viewBox="120 132 1030 1030" aria-hidden="true"><g transform="translate(0 1254) scale(.1 -.1)" fill="#F98714"><path d="M8195 9866 c-49 -32 -153 -97 -460 -286 -82 -51 -206 -127 -275 -170 -162 -100 -635 -391 -677 -416 -18 -10 -127 -77 -242 -149 l-210 -130 -1 -87 0 -87 48 -6 c252 -34 429 -168 503 -382 l20 -58 0 -2915 c0 -1603 3 -2920 7 -2927 8 -13 311 -14 2579 -13 l992 0 128 176 c312 429 596 854 582 869 -2 1 -62 -5 -134 -16 -285 -40 -685 -101 -770 -116 l-90 -16 -967 -4 -968 -4 0 3386 c0 1862 -3 3385 -7 3384 -5 0 -30 -15 -58 -33z"/><path d="M5993 8159 c-22 -30 -90 -126 -153 -214 -62 -88 -130 -182 -150 -210 -54 -74 -123 -170 -348 -485 -112 -157 -234 -328 -272 -380 -38 -52 -113 -156 -166 -230 -54 -74 -125 -173 -159 -220 -90 -126 -159 -221 -250 -350 -45 -63 -186 -261 -315 -440 -128 -179 -288 -401 -355 -495 -66 -93 -143 -201 -171 -239 -27 -38 -74 -104 -104 -147 -98 -137 -288 -402 -352 -489 -34 -47 -134 -186 -223 -310 -88 -124 -184 -256 -212 -295 -27 -38 -141 -198 -253 -355 -112 -157 -219 -305 -239 -330 -146 -185 -406 -449 -595 -605 -60 -50 -121 -100 -135 -112 l-26 -22 1432 -1 1433 0 -109 108 -109 107 -33 70 c-109 232 -14 433 510 1081 35 43 84 102 109 129 l45 50 848 3 849 2 0 419 0 419 -22 6 c-13 3 -270 6 -572 6 l-548 0 28 38 c36 47 385 491 645 818 182 230 294 373 422 537 l47 61 0 861 0 861 -15 57 c-47 182 -203 317 -395 343 l-48 6 -39 -53z"/></g></svg></div>
  <h1>Albion Meter</h1>
  <div class="status" id="status" aria-live="polite">Starting…</div>
  <div class="detail" id="detail"></div>
  <div class="track" aria-hidden="true"><i id="progress"></i></div>
  <div class="failure" role="alert">
    <p id="message"></p>
    <div class="actions">
      <button data-startup="logs">Logs</button>
      <button data-startup="quit">Close</button>
      <button class="primary" data-startup="retry">Try again</button>
    </div>
  </div>
  <div class="version" id="version"></div>
</main>
<script>
const desktop = window.albionDesktop;
function render(startup) {
  const steps = startup.steps ?? [];
  const current = steps.find(step => step.state === 'active') ?? steps.find(step => step.state === 'error');
  const finished = steps.filter(step => step.state === 'done' || step.state === 'warning').length;
  const notice = steps.find(step => step.state === 'warning' || (step.state === 'active' && step.detail));
  document.getElementById('status').textContent = startup.ready ? 'Ready' : current ? `${current.label}…` : 'Starting…';
  const detail = document.getElementById('detail');
  detail.textContent = notice?.detail ?? '';
  detail.className = `detail${notice?.state === 'warning' ? ' warning' : ''}`;
  document.getElementById('progress').style.width = `${steps.length ? Math.max(8, (finished / steps.length) * 100) : 8}%`;
  document.getElementById('message').textContent = startup.error ?? '';
  document.body.classList.toggle('failed', Boolean(startup.error));
  document.body.classList.toggle('leaving', Boolean(startup.ready));
}
document.querySelectorAll('[data-window]').forEach(button => button.addEventListener('click', () => desktop?.window(button.dataset.window)));
document.querySelectorAll('[data-startup]').forEach(button => button.addEventListener('click', () => desktop?.startup(button.dataset.startup)));
if (desktop) {
  desktop.onStartup(render);
  desktop.info().then(info => { document.getElementById('version').textContent = `v${info.version}`; render(info.startup); });
}
</script>
</body>
</html>
