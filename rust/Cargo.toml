[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
meter-capture = { path = "crates/meter-capture" }
meter-core = { path = "crates/meter-core" }
meter-store = { path = "crates/meter-store" }
meter-lab = { path = "crates/meter-lab" }
meter-runtime = { path = "crates/meter-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
