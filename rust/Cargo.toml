[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"

[workspace.dependencies]
# Without libpcap by default: Linux captures through its own packet sockets, and an AppImage linked to the build
# machine's libpcap (libpcap.so.0.8 on Ubuntu) would not start on distributions that name it libpcap.so.1. Windows
# turns it on (Npcap, delay-loaded) in meter-runtime.
meter-capture = { path = "crates/meter-capture", default-features = false }
meter-core = { path = "crates/meter-core" }
meter-store = { path = "crates/meter-store" }
meter-lab = { path = "crates/meter-lab" }
meter-runtime = { path = "crates/meter-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
# Built for size: "s" keeps the meter under its 20 MB budget (28 MB at 3). Decoding costs the same (the replay of a
# 30-minute raid takes 1.26 s either way); drawing a 4 Hz fight costs ~1 point more of one core in a 1256×1374 window
# and stays under the 5 % gate at the default 1280×820. "z" was tried and doubles the drawing cost.
opt-level = "s"
