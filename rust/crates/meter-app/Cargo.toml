[package]
name = "meter-app"
version.workspace = true
edition.workspace = true

[dependencies]
# winit + femtovg (OpenGL) with the software renderer as the fallback for machines without a usable GPU driver; no Qt,
# no Skia, no accessibility bridge, no system tray: they would double the binary.
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-path", "unstable-winit-030"] }

# Finds a control by its accessible label to hover it in fixture screenshots (feature `parity`, used by
# rust/scripts/ui-parity.mjs); the UI tests use it to click.
i-slint-backend-testing = { version = "=1.19.1", optional = true }
# The ranking picture on the clipboard (Slint's clipboard is text only).
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
meter-core.workspace = true
meter-runtime.workspace = true
serde.workspace = true
# Object keys keep the server's order (the diagnostics are listed in it).
serde_json = { workspace = true, features = ["preserve_order"] }

[features]
parity = ["dep:i-slint-backend-testing"]

[dev-dependencies]
i-slint-backend-testing = "=1.19.1"

[build-dependencies]
slint-build = "1.19"
