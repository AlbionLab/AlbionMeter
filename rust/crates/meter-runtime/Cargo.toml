[package]
name = "meter-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
meter-capture.workspace = true
meter-core.workspace = true
meter-lab.workspace = true
meter-store.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = "1"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.191"

[dev-dependencies]
sha2 = "0.10"

# Npcap devices next to the raw sockets on Windows (wpcap.dll is delay-loaded, so the meter starts without Npcap).
[target.'cfg(windows)'.dependencies]
meter-capture = { workspace = true, features = ["pcap"] }
